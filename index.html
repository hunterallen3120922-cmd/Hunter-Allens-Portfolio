<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hunter's portfolio: a 3D bedroom you can click around in.">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Hunter's Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed 3D diorama of a bedroom at night. Type floats in the corners,
   content arrives as a side sheet (bottom sheet on phones). Single dark look by choice:
   the room is lit by a lamp, a monitor and the moon. */
:root{
  color-scheme: dark;
  --night:#090b17;
  --dusk:#1b1f3d;
  --sheet:#131529;
  --lamp:#ffb766;
  --screen:#7fe0d0;
  --plum:#a585bd;
  --paper:#f3ead9;
  --paper-soft:rgba(243,234,217,.68);
  --paper-faint:rgba(243,234,217,.42);
  --line:rgba(243,234,217,.14);
  --fill:rgba(243,234,217,.06);
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Helvetica Neue',Arial,system-ui,sans-serif;
  --font-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
html,body{height:100%}
body{
  background:
    radial-gradient(60% 50% at 50% 62%, var(--dusk) 0%, transparent 70%),
    var(--night);
  color:var(--paper);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  overflow:hidden;
  padding-left:var(--gutter-l);
  padding-right:var(--gutter-r);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;border-radius:6px}

#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.is-dragging{cursor:grabbing}
#scene.is-pointing{cursor:pointer}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(4,5,12,.72) 100%)}

/* corner type */
.brand{position:fixed;z-index:3;pointer-events:none;
  top:calc(env(safe-area-inset-top, 0px) + 20px);
  left:calc(var(--gutter-l) + 8px);
  display:flex;flex-direction:column;gap:6px;max-width:min(520px, 70vw)}
.brand h1{margin:0;font-family:var(--font-display);font-weight:800;
  font-size:clamp(2.6rem, 7vw, 5.2rem);line-height:.86;letter-spacing:-.045em;text-wrap:balance}
.brand h1 span{display:block;font-weight:400;font-size:.36em;letter-spacing:-.01em;line-height:1.2;color:var(--paper-soft);margin-top:.5em}
.eyebrow{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.status{position:fixed;z-index:3;pointer-events:none;
  top:calc(env(safe-area-inset-top, 0px) + 24px);
  right:calc(var(--gutter-r) + 8px);
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-faint);
  text-align:right;display:flex;flex-direction:column;gap:4px;transition:opacity .3s}
.status b{color:var(--paper-soft);font-weight:500}
body.has-panel .status,body.has-panel .brand{opacity:0}
.brand{transition:opacity .3s}

/* dock */
.dock{position:fixed;z-index:4;left:0;right:0;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);
  padding-left:var(--gutter-l);padding-right:var(--gutter-r);
  display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;transition:opacity .3s, transform .3s}
.dock ul{list-style:none;margin:0;padding:6px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;
  background:rgba(14,16,32,.72);border:1px solid var(--line);border-radius:999px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);pointer-events:auto}
.dock button{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;
  padding:9px 14px;border-radius:999px;color:var(--paper-soft);transition:background .2s,color .2s}
.dock button:hover{background:var(--fill);color:var(--paper)}
.dock button[aria-pressed="true"]{background:var(--lamp);color:#20140a}
.hint{margin:0;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;color:var(--paper-faint);text-align:center}

/* hotspot markers */
#markers{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.marker{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:8px;
  transform:translate(-999px,-999px);transition:opacity .35s;will-change:transform}
.marker[data-off="true"]{opacity:0;pointer-events:none}
.marker i{position:relative;display:block;width:14px;height:14px;border-radius:50%;background:var(--lamp);
  box-shadow:0 0 0 4px rgba(255,183,102,.22), 0 0 18px 4px rgba(255,183,102,.55);flex:none;margin-left:-7px}
.marker i::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px solid var(--lamp);opacity:0;
  animation:ping 2.6s ease-out infinite}
.marker:nth-child(2) i::after{animation-delay:.5s}
.marker:nth-child(3) i::after{animation-delay:1s}
.marker:nth-child(4) i::after{animation-delay:1.5s}
.marker:nth-child(5) i::after{animation-delay:2s}
.marker span{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  padding:5px 10px;border-radius:999px;background:rgba(14,16,32,.78);border:1px solid var(--line);color:var(--paper);
  transition:background .2s,color .2s,transform .2s}
.marker:hover span,.marker.is-hot span,.marker:focus-visible span{background:var(--lamp);color:#20140a;transform:translateX(3px)}
@keyframes ping{0%{transform:scale(.5);opacity:.9}70%,100%{transform:scale(1.7);opacity:0}}

/* sheet */
#panel{position:fixed;z-index:6;top:calc(env(safe-area-inset-top, 0px) + 16px);
  bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
  right:var(--gutter-r);width:min(440px, calc(100% - 32px));
  background:color-mix(in srgb, var(--sheet) 90%, transparent);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border:1px solid var(--line);border-radius:24px;
  display:flex;flex-direction:column;min-width:0;
  transform:translateX(calc(100% + 40px));opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
#panel.open{transform:none;opacity:1}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 24px 14px}
.panel-head h2{margin:6px 0 0;font-family:var(--font-display);font-weight:800;font-size:2.5rem;line-height:.95;letter-spacing:-.035em;text-wrap:balance}
.close{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:1.1rem;color:var(--paper-soft)}
.close:hover{background:var(--fill);color:var(--paper)}
.panel-body{padding:4px 24px 28px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:18px}
.panel-body p{margin:0;color:var(--paper-soft);max-width:60ch}
.panel-body p.lead{color:var(--paper);font-size:1.12rem;line-height:1.45}
.ph{align-self:flex-start;font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--plum);border:1px dashed color-mix(in srgb, var(--plum) 60%, transparent);border-radius:6px;padding:4px 8px}

.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cards li{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--fill)}
.cards h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.2rem;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cards h3 small{font-family:var(--font-mono);font-weight:400;font-size:.68rem;letter-spacing:.08em;color:var(--paper-faint);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.06em;color:var(--screen);border:1px solid color-mix(in srgb, var(--screen) 35%, transparent);border-radius:999px;padding:2px 8px}

.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;border-top:1px solid var(--line);padding-top:16px}
.facts dt{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-faint);padding-top:3px}
.facts dd{margin:0;color:var(--paper);min-width:0}

.shelf{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shelf li{border-radius:14px;padding:14px;background:var(--fill);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.shelf b{font-family:var(--font-display);font-weight:600;font-size:1.05rem}
.shelf span{font-size:.88rem;color:var(--paper-soft)}

.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.timeline li{position:relative;display:flex;flex-direction:column;gap:2px}
.timeline li::before{content:"";position:absolute;left:-23px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--lamp)}
.timeline time{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;color:var(--lamp)}
.timeline b{font-family:var(--font-display);font-weight:600;font-size:1.1rem}
.timeline span{color:var(--paper-soft);font-size:.92rem}

.contact{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.contact li{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--fill);min-width:0}
.contact div{min-width:0;display:flex;flex-direction:column}
.contact small{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-faint)}
.contact code{font-family:var(--font-mono);font-size:.92rem;color:var(--paper);overflow-wrap:anywhere;user-select:all}
.copy{flex:none;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--paper-soft)}
.copy:hover{background:var(--lamp);color:#20140a;border-color:transparent}

/* loader, toast, fallback */
#loader{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--night);transition:opacity .9s .1s;pointer-events:none}
#loader p{margin:0;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-soft)}
body.ready #loader{opacity:0}
#toast{position:fixed;z-index:7;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 96px);transform:translate(-50%,10px);
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;padding:8px 14px;border-radius:999px;background:var(--paper);color:#17110a;
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fallback{position:fixed;z-index:1;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--paper-soft)}
#fallback p{max-width:38ch;margin:0}

@media (max-width:720px){
  .status{display:none}
  .marker span{display:none}
  .dock button{padding:8px 8px;font-size:.62rem;letter-spacing:.03em}
  .dock ul{border-radius:22px;gap:0}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:62%;border-radius:24px 24px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom, 0px);transform:translateY(105%)}
  .panel-head{padding:20px max(20px, env(safe-area-inset-right, 0px)) 10px max(20px, env(safe-area-inset-left, 0px))}
  .panel-head h2{font-size:2rem}
  .panel-body{padding:4px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px))}
  body.has-panel .dock{opacity:0;transform:translateY(20px);pointer-events:none}
  body.has-panel .dock ul{pointer-events:none}
}
@media (prefers-reduced-motion:reduce){
  .marker i::after{animation:none}
  #panel,#loader,.dock{transition:none}
}
</style>
</head>
<body>

<canvas id="scene" aria-label="A 3D model of Hunter's bedroom at night. Use the buttons below to open each section."></canvas>
<div class="vignette"></div>
<div id="fallback" hidden><p>The 3D room could not load in this browser. Everything in it is still here: use the buttons below.</p></div>

<header class="brand">
  <div class="eyebrow">Portfolio · Room 01</div>
  <h1>Hunter<span>Come in. Everything in here says something about me.</span></h1>
</header>
<div class="status" aria-hidden="true">
  <div>Local time <b id="clockText">--:--</b></div>
  <div>Lamp <b id="lampText">on</b></div>
</div>

<div id="markers"></div>

<nav class="dock" aria-label="Sections">
  <ul>
    <li><button type="button" data-open="projects" aria-pressed="false">Projects</button></li>
    <li><button type="button" data-open="about" aria-pressed="false">About</button></li>
    <li><button type="button" data-open="interests" aria-pressed="false">Interests</button></li>
    <li><button type="button" data-open="journey" aria-pressed="false">Journey</button></li>
    <li><button type="button" data-open="contact" aria-pressed="false">Say hi</button></li>
  </ul>
  <p class="hint">Drag to look around. Click anything that glows. The desk lamp works.</p>
</nav>

<aside id="panel" role="dialog" aria-labelledby="panelTitle" hidden>
  <div class="panel-head">
    <div>
      <div class="eyebrow" id="panelEyebrow"></div>
      <h2 id="panelTitle"></h2>
    </div>
    <button type="button" class="close" id="panelClose" aria-label="Close and go back to the room">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>
<div id="toast" role="status"></div>
<div id="loader"><p>Opening the door</p></div>

<template id="tpl-projects">
  <span class="ph">Placeholder projects. Send me the real ones.</span>
  <p class="lead">The things I have built, shipped, broken and rebuilt. Each one opens into a case study.</p>
  <ul class="cards">
    <li><h3>The flagship <small>20XX</small></h3><p>The one I would demo first. One line on what it does, one on why it was hard to make.</p><div class="tags"><span>stack</span><span>role</span><span>live link</span></div></li>
    <li><h3>The weekend hack <small>20XX</small></h3><p>Built in 48 hours because the idea would not leave me alone. Rough edges kept on purpose.</p><div class="tags"><span>prototype</span><span>repo</span></div></li>
    <li><h3>The open source one <small>20XX</small></h3><p>A tool I made for myself that other people ended up using.</p><div class="tags"><span>library</span><span>stars</span></div></li>
    <li><h3>The weird one <small>20XX</small></h3><p>No business case. I made it because it made me laugh, and it is probably my favorite.</p><div class="tags"><span>experiment</span></div></li>
  </ul>
</template>

<template id="tpl-about">
  <span class="ph">Placeholder bio. Tell me the true version.</span>
  <p class="lead">Hi, I'm Hunter. This is where I sleep, work, and get most of my ideas, usually in that order.</p>
  <p>The short version of me goes here: what I do, what I care about, and the thing people tend to remember after we meet. Two or three sentences, written the way I actually talk.</p>
  <dl class="facts">
    <dt>Based in</dt><dd>Your city</dd>
    <dt>Right now</dt><dd>What you are working on this month</dd>
    <dt>Runs on</dt><dd>Your drink of choice</dd>
    <dt>Awake at</dt><dd>The hour you do your best work</dd>
  </dl>
</template>

<template id="tpl-interests">
  <span class="ph">Placeholder shelf. Swap in what is really on yours.</span>
  <p class="lead">The shelf is the honest part of any room. Here is what is on mine.</p>
  <ul class="shelf">
    <li><b>Reading</b><span>Three books that changed how you think.</span></li>
    <li><b>Listening</b><span>The album you have on repeat.</span></li>
    <li><b>Playing</b><span>Games, sports, or instruments.</span></li>
    <li><b>Making</b><span>What you build with your hands.</span></li>
    <li><b>Watching</b><span>Films or shows you quote too often.</span></li>
    <li><b>Outside</b><span>Where you go when the screen is off.</span></li>
  </ul>
</template>

<template id="tpl-journey">
  <span class="ph">Placeholder timeline. Give me your real milestones.</span>
  <p class="lead">Pinned to the corkboard: how I got here.</p>
  <ol class="timeline">
    <li><time>NOW</time><b>What you are doing today</b><span>Role, school, or the thing you are building.</span></li>
    <li><time>20XX</time><b>The turning point</b><span>The job, class, or project that changed your direction.</span></li>
    <li><time>20XX</time><b>The first real thing</b><span>The first thing you made that someone else used.</span></li>
    <li><time>20XX</time><b>Where it started</b><span>The moment you got hooked.</span></li>
  </ol>
</template>

<template id="tpl-contact">
  <span class="ph">Placeholder contact details.</span>
  <p class="lead">The phone is right there on the nightstand. I do answer it.</p>
  <ul class="contact">
    <li><div><small>Email</small><code id="c-email">you@example.com</code></div><button type="button" class="copy" data-copy="c-email">Copy</button></li>
    <li><div><small>GitHub</small><code id="c-gh">github.com/your-handle</code></div><button type="button" class="copy" data-copy="c-gh">Copy</button></li>
    <li><div><small>Elsewhere</small><code id="c-el">linkedin, x, or wherever you post</code></div><button type="button" class="copy" data-copy="c-el">Copy</button></li>
  </ul>
  <p>Best for: project ideas, collaborations, and telling me which object in this room I should make clickable next.</p>
</template>

<script>
/* ---------- UI: works with or without the 3D scene ---------- */
(function(){
  const SECTIONS = {
    projects:{eyebrow:'On the monitor', title:'Projects'},
    about:{eyebrow:'On the bed', title:'About me'},
    interests:{eyebrow:'On the bookshelf', title:'Interests'},
    journey:{eyebrow:'On the corkboard', title:'Journey'},
    contact:{eyebrow:'On the nightstand', title:'Say hi'}
  };
  const panel = document.getElementById('panel');
  const body = document.getElementById('panelBody');
  const dock = document.querySelectorAll('.dock button');
  let current = null, lastFocus = null, hideTimer = 0;

  function open(id){
    if(!SECTIONS[id]) return;
    if(current === id) return;
    if(!current) lastFocus = document.activeElement;
    current = id;
    clearTimeout(hideTimer);
    document.getElementById('panelEyebrow').textContent = SECTIONS[id].eyebrow;
    document.getElementById('panelTitle').textContent = SECTIONS[id].title;
    body.replaceChildren(document.getElementById('tpl-' + id).content.cloneNode(true));
    body.scrollTop = 0;
    panel.hidden = false;
    document.body.classList.add('has-panel');
    requestAnimationFrame(()=>requestAnimationFrame(()=>panel.classList.add('open')));
    dock.forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.open === id)));
    document.getElementById('panelClose').focus({preventScroll:true});
    try{ history.replaceState(null,'','#' + id); }catch(e){}
    window.dispatchEvent(new CustomEvent('room:focus',{detail:id}));
  }
  function close(){
    if(!current) return;
    current = null;
    panel.classList.remove('open');
    document.body.classList.remove('has-panel');
    hideTimer = setTimeout(()=>{ panel.hidden = true; }, 600);
    dock.forEach(b=>b.setAttribute('aria-pressed','false'));
    try{ history.replaceState(null,'', location.pathname + location.search); }catch(e){}
    if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
    window.dispatchEvent(new CustomEvent('room:focus',{detail:null}));
  }
  dock.forEach(b=>b.addEventListener('click',()=> current === b.dataset.open ? close() : open(b.dataset.open)));
  document.getElementById('panelClose').addEventListener('click', close);
  window.addEventListener('keydown', e=>{ if(e.key === 'Escape') close(); });
  body.addEventListener('click', e=>{
    const btn = e.target.closest('.copy'); if(!btn) return;
    const el = document.getElementById(btn.dataset.copy);
    const done = ()=>{ btn.textContent = 'Copied'; setTimeout(()=>btn.textContent = 'Copy', 1400); };
    const select = ()=>{ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected'; setTimeout(()=>btn.textContent = 'Copy', 1400); };
    try{ navigator.clipboard.writeText(el.textContent).then(done, select); }catch(err){ select(); }
  });

  let toastTimer = 0;
  function toast(msg){
    const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }
  function tick(){
    const d = new Date();
    document.getElementById('clockText').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  tick(); setInterval(tick, 15000);

  window.RoomUI = {open, close, toast, get current(){ return current; }};
  window.addEventListener('hashchange', ()=>{ const h = location.hash.slice(1); if(SECTIONS[h]) open(h); });
  window.addEventListener('room:ready', ()=>{ const h = location.hash.slice(1); if(SECTIONS[h]) setTimeout(()=>open(h), 1800); });

  // If the 3D scene never arrives, the page still works as a plain portfolio.
  setTimeout(()=>{
    if(!window.__roomReady){
      document.getElementById('fallback').hidden = false;
      document.body.classList.add('ready');
      const h = location.hash.slice(1); if(SECTIONS[h]) open(h);
    }
  }, 9000);
})();
</script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const V3 = THREE.Vector3;
const canvas = document.getElementById('scene');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try{

/* ---------- helpers ---------- */
let seed = 20261114;
const rnd = ()=>{ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a,b)=> a + rnd()*(b-a);
const pick = arr => arr[Math.floor(rnd()*arr.length)];

function ctex(w,h,draw,repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g,w,h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if(repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const std = o => new THREE.MeshStandardMaterial(o);
function mesh(geo, mat, pos, parent, shadow = true){
  const m = new THREE.Mesh(geo, mat);
  if(pos) m.position.set(pos[0],pos[1],pos[2]);
  m.castShadow = shadow; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
const box = (w,h,d,mat,pos,parent,shadow) => mesh(new THREE.BoxGeometry(w,h,d), mat, pos, parent, shadow);
const cyl = (rt,rb,h,mat,pos,parent,seg=28) => mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat, pos, parent);
function rboxGeo(w,h,d,r){
  r = Math.min(r, w*0.45, h*0.45, d*0.45);
  const sw = w-2*r, sh = h-2*r, cr = Math.min(r, sw/2, sh/2)*0.98;
  const s = new THREE.Shape();
  s.moveTo(-sw/2+cr, -sh/2);
  s.lineTo(sw/2-cr, -sh/2); s.absarc(sw/2-cr, -sh/2+cr, cr, -Math.PI/2, 0);
  s.lineTo(sw/2, sh/2-cr); s.absarc(sw/2-cr, sh/2-cr, cr, 0, Math.PI/2);
  s.lineTo(-sw/2+cr, sh/2); s.absarc(-sw/2+cr, sh/2-cr, cr, Math.PI/2, Math.PI);
  s.lineTo(-sw/2, -sh/2+cr); s.absarc(-sw/2+cr, -sh/2+cr, cr, Math.PI, Math.PI*1.5);
  const g = new THREE.ExtrudeGeometry(s, {depth:d-2*r, bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:4, curveSegments:8});
  g.center(); return g;
}
const rbox = (w,h,d,r,mat,pos,parent) => mesh(rboxGeo(w,h,d,r), mat, pos, parent);

const glowTex = ctex(128,128,(g,w,h)=>{
  const gr = g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,255,255,.45)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,w,h);
});
function glow(color, size, pos, parent, opacity = .8){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity}));
  s.scale.setScalar(size); s.position.set(pos[0],pos[1],pos[2]); (parent || scene).add(s); return s;
}

  g.putImageData(id,0,0);
}, rep);

const floorTex = ctex(2048,2048,(g,w,h)=>{
  const rows = 22, ph = h/rows;
  for(let r=0;r<rows;r++){
    let x = -rnd()*w*.3;
    while(x < w){
      const len = w*rr(.28,.5);
      g.fillStyle = `hsl(${rr(24,31)} ${rr(34,44)}% ${rr(33,43)}%)`;
      g.fillRect(x, r*ph, len, ph);
      for(let i=0;i<46;i++){
        g.strokeStyle = `rgba(${rnd()<.5?'30,14,4':'255,225,180'},${rr(.02,.1)})`;
        g.lineWidth = rr(.6,2.2);
        const y = r*ph + rnd()*ph, x0 = x + rnd()*len*.7, l = rr(60,len*.6);
        g.beginPath(); g.moveTo(x0,y); g.bezierCurveTo(x0+l*.3, y+rr(-3,3), x0+l*.6, y+rr(-3,3), x0+l, y+rr(-2,2)); g.stroke();
      }
      g.fillStyle = 'rgba(20,10,4,.55)'; g.fillRect(x+len-1.5, r*ph, 3, ph);
      x += len;
    }
    g.fillStyle = 'rgba(20,10,4,.5)'; g.fillRect(0, r*ph-1.5, w, 3);
  }
});

  const mx = w*.62, my = h*.26;
  const mg = g.createRadialGradient(mx,my,10,mx,my,170); mg.addColorStop(0,'rgba(220,230,255,.55)'); mg.addColorStop(1,'rgba(220,230,255,0)');
  g.fillStyle = mg; g.fillRect(0,0,w,h);

    for(let yy=h-bh+10; yy<h-8; yy+=16) for(let xx=x+7; xx<x+bw-9; xx+=14)

    x += bw + rr(0,8);
  }
});

function curtain(z, w){
  const g = new THREE.PlaneGeometry(w, 1.42, 36, 1);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){ const u = p.getX(i)/w + .5; p.setZ(i, Math.sin(u*Math.PI*9)*.028 + Math.sin(u*23)*.008); }
  g.computeVertexNormals();
  const m = mesh(g, fabric(0xcfc3ae, {side:THREE.DoubleSide, roughness:1}), [-2.43,1.5,z]);
  m.rotation.y = Math.PI/2; return m;
}

const rugTex = ctex(1024,720,(g,w,h)=>{
  g.fillStyle = '#d9cdb6'; g.fillRect(0,0,w,h);
  g.strokeStyle = '#2b3350'; g.lineWidth = 16; g.strokeRect(34,34,w-68,h-68);
  g.strokeStyle = '#b75d3c'; g.lineWidth = 6; g.strokeRect(62,62,w-124,h-124);
  const cols = ['#b75d3c','#2b3350','#3c7a74','#e0a64a'];
  for(let i=0;i<7;i++) for(let j=0;j<4;j++){
    const cx = 150 + i*120, cy = 150 + j*140, k = (i+j)%4;
    g.fillStyle = cols[k]; g.beginPath();
    if((i+j)%2){ g.moveTo(cx,cy-46); g.lineTo(cx+46,cy); g.lineTo(cx,cy+46); g.lineTo(cx-46,cy); }
    else { g.arc(cx,cy,40,0,Math.PI,(i%2)===0); }
    g.closePath(); g.fill();
  }
  const id = g.getImageData(0,0,w,h);
  for(let i=0;i<id.data.length;i+=4){ const n = (Math.random()-.5)*26; id.data[i]+=n; id.data[i+1]+=n; id.data[i+2]+=n; }
  g.putImageData(id,0,0);
});

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null, moved = 0, hoverId = null;
function hit(ev){
  const r = canvas.getBoundingClientRect();
  ndc.set((ev.clientX-r.left)/r.width*2-1, -(ev.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(hotGroups, true)[0]; if(!h) return null;
  let o = h.object; while(o && !o.userData.hot && !o.userData.action) o = o.parent;
  return o ? (o.userData.hot || '@' + o.userData.action) : null;
}
canvas.addEventListener('pointerdown', e=>{ down = {x:e.clientX, y:e.clientY}; moved = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e=>{
  if(down){
    const dx = e.clientX-down.x, dy = e.clientY-down.y; moved += Math.abs(dx)+Math.abs(dy); down.x = e.clientX; down.y = e.clientY;
    if(moved > 6){ canvas.classList.add('is-dragging'); const lim = focusId ? .22 : .55;
      yawGoal = THREE.MathUtils.clamp(yawGoal - dx*.0045, -lim, lim*.9);
      pitchGoal = THREE.MathUtils.clamp(pitchGoal + dy*.003, -.14, .22); }
  } else if(e.pointerType === 'mouse'){
    parXG = (e.clientX/W - .5); parYG = (e.clientY/H - .5);
    const id = hit(e);
    if(id !== hoverId){ hoverId = id; canvas.classList.toggle('is-pointing', !!id);
      Object.entries(HOT).forEach(([k,h])=> h.el.classList.toggle('is-hot', k === id)); }
  }
});
function up(e){
  canvas.classList.remove('is-dragging');
  if(down && moved <= 6){
    const id = hit(e);
    if(id === '@lamp') toggleLamp();
    else if(id) window.RoomUI.open(id);
    else if(focusId) window.RoomUI.close();
  }
  down = null;
}

/* ---------- render loop ---------- */
const sph = new THREE.Spherical(), off = new V3(), proj = new V3(), clockT = new THREE.Clock();
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
let first = true;
function frame(){
  const dt = Math.min(clockT.getDelta(), .05), time = clockT.elapsedTime, s = 1 - Math.exp(-dt*5);
  if(tw < 1){ tw = Math.min(1, tw + dt/twDur); const e = ease(tw); cur.pos.lerpVectors(from.pos,to.pos,e); cur.tgt.lerpVectors(from.tgt,to.tgt,e); }
  yaw += (yawGoal-yaw)*s; pitch += (pitchGoal-pitch)*s;
  if(!reduceMotion){ parX += (parXG-parX)*s*.6; parY += (parYG-parY)*s*.6; }
  off.copy(cur.pos).sub(cur.tgt); sph.setFromVector3(off);
  sph.theta += yaw - parX*.09; sph.phi = THREE.MathUtils.clamp(sph.phi - pitch - parY*.05, .45, 1.5);
  off.setFromSpherical(sph); camera.position.copy(cur.tgt).add(off); camera.lookAt(cur.tgt);
  const ins = panelInset(); shiftX += (ins[0]/2 - shiftX)*s; shiftY += (ins[1]/2 - shiftY)*s;
  if(Math.abs(shiftX) > .5 || Math.abs(shiftY) > .5) camera.setViewOffset(W,H,shiftX,shiftY,W,H); else camera.clearViewOffset();

  lampK += ((lampOn?1:0) - lampK)*s*1.6;
  deskSpot.intensity = 9*lampK; lampGlow.material.opacity = .7*lampK; bulbMat.color.setRGB(.12+.88*lampK, .1+.79*lampK, .08+.61*lampK);
  twinkles.forEach((t,i)=> t.material.opacity = .55 + Math.sin(time*1.3 + i*1.9)*.18);
  screenLight.intensity = .5 + Math.sin(time*2.1)*.03;

  renderer.render(scene, camera);

  for(const id in HOT){ const h = HOT[id]; proj.copy(h.anchor).project(camera);
    const offscreen = proj.z > 1 || Math.abs(proj.x) > 1.05 || Math.abs(proj.y) > 1.05;
    h.el.dataset.off = String(!!focusId || offscreen || tw < .6 && first);
    h.el.style.transform = `translate(${((proj.x+1)/2*W).toFixed(1)}px,${((1-proj.y)/2*H - 7).toFixed(1)}px)`; }
  if(first && tw >= 1) first = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(()=>{
  frame();
  window.__roomReady = true;
  document.body.classList.add('ready');
  window.dispatchEvent(new Event('room:ready'));
});
window.__room = {scene, camera, renderer, go};
</script>
